syntax = "proto3";

package emery.agents;

// Service for executing agent tasks on worker instances
service AgentWorker {
  // Execute a task and stream progress updates back to the API server
  rpc ExecuteTask(TaskRequest) returns (stream TaskProgress);

  // Get worker health status and available skills
  rpc GetWorkerInfo(Empty) returns (WorkerInfo);
  
  // Cancel a running task
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

// Request to execute a specific agent task
message TaskRequest {
  string task_id = 1;              // Unique task identifier
  int32 agent_id = 2;              // Agent to execute the task
  oneof execution_mode {
    string skill_name = 3;          // Direct skill execution
    InstructionConfig instruction_config = 9; // Instruction-based execution with auto-routing
  }
  AgentConfig agent_config = 4;    // Complete agent configuration
  TriggerData trigger_data = 5;    // Structured trigger data
  string organization_id = 6;      // Organization for multi-tenant routing
  string owner_id = 7;             // Agent owner ID for OAuth credentials
  int32 timeout_seconds = 8;       // Task execution timeout (default: 300)
  string name = 10;
  string organization_model = 11;  // Organization default model (fallback for agent)
}

// AIDEV-NOTE: Simplified for single-instruction execution (removed step_id and step_type)
// Streaming progress updates during task execution
message TaskProgress {
  string task_id = 1;              // Task being updated
  TaskStatus status = 2;           // Current task status
  string output_json = 5;          // Execution output data as JSON
  string error_message = 6;        // Error details if failed
  int64 timestamp_ms = 7;          // Update timestamp
  float progress_percent = 8;      // Completion percentage (0-100)
  TokenUsage token_usage = 9;      // Token usage for this task (set when completed)
}

// Task execution status enum
enum TaskStatus {
  TASK_PENDING = 0;
  TASK_IN_PROGRESS = 1;
  TASK_COMPLETED = 2;
  TASK_FAILED = 3;
  TASK_CANCELLED = 4;
  TASK_TIMEOUT = 5;
}

// Request to cancel a running task
message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;               // Optional cancellation reason
}

// Response to task cancellation request
message CancelTaskResponse {
  bool success = 1;
  string message = 2;
}

// Worker health and skill information
message WorkerInfo {
  string worker_id = 1;            // Unique worker instance ID
  string version = 2;              // Worker software version
  string organization_id = 3;      // Organization this worker serves
  WorkerStatus status = 4;         // Current worker status
  repeated string skills = 5;      // Available agent skills
  int32 active_tasks = 6;          // Number of currently running tasks
  int32 max_concurrent_tasks = 7;  // Maximum concurrent task capacity
  int64 uptime_seconds = 8;        // Worker uptime
  repeated string supported_tools = 9; // Available MCP tools
}

// Worker health status
enum WorkerStatus {
  WORKER_HEALTHY = 0;
  WORKER_BUSY = 1;
  WORKER_DEGRADED = 2;
  WORKER_UNHEALTHY = 3;
  WORKER_SHUTTING_DOWN = 4;
}

// Empty message for requests with no parameters
message Empty {}

// Standard error response
message ErrorResponse {
  string code = 1;                 // Error code (e.g., "TASK_NOT_FOUND")
  string message = 2;              // Human-readable error message
  string details = 3;              // Additional error details
}

// Token usage tracking for billing
message TokenUsage {
  string model_name = 1;             // Model used for this operation
  int32 input_tokens = 2;            // Input/prompt tokens consumed
  int32 output_tokens = 3;           // Output/completion tokens generated
  int32 total_tokens = 4;            // Total tokens (input + output)
  double cost_usd = 5;               // Estimated cost in USD
}
// Complete agent configuration
message AgentConfig {
  string name = 1;
  string role = 2;
  string description = 3;
  string persona = 4;
  repeated ToolConfig tools = 5;
  repeated ServerConfig servers = 6;
  repeated SkillConfig skills = 7;
  string default_model = 8;              // Agent-specific default model (overrides organization default)
}

// AIDEV-NOTE: Simplified single-instruction skill model (removed multi-step workflow)
// Skill configuration with single instruction block
message SkillConfig {
  string name = 1;
  string description = 2;
  repeated SkillInput inputs = 3;
  repeated SkillOutput outputs = 4;
  string instructions = 5;
  repeated ToolConfig tools = 6;
  string model = 7;                    // Optional: model override for this skill
}

// Skill input parameter
message SkillInput {
  string name = 1;
  bool required = 2;
}

// Skill output value
message SkillOutput {
  string name = 1;
}


// Tool configuration
message ToolConfig {
  string name = 1;
  string version = 2;
  map<string, string> config = 3;
}

// Server configuration
message ServerConfig {
  string name = 1;
  string endpoint = 2;
  map<string, string> config = 3;
}

// Trigger data payload
message TriggerData {
  map<string, string> payload = 1;
}

// Instruction-based execution configuration for auto-routing
message InstructionConfig {
  string instructions = 1;           // Natural language instructions
  repeated ToolConfig tools = 2;     // Optional tools for this task
  repeated ServerConfig servers = 3; // Optional servers for this task
  string model = 4;                  // Optional: model override for this instruction
}

// gRPC Chat Processing Service - AI operations only (stateless)
service ChatProcessingService {
  // Process a message and stream AI response (no database operations)
  rpc ProcessMessage(ProcessMessageRequest) returns (stream ProcessMessageResponse);

  // Cancel an in-progress message processing
  rpc CancelMessage(CancelMessageRequest) returns (CancelMessageResponse);
}

// Request for AI message processing
message ProcessMessageRequest {
  // Input message for AI processing
  string message_content = 1;        // User message content
  string user_id = 2;                // User identifier for context
  int32 organization_id = 3;         // Organization for multi-tenant routing

  // Context for RAG and domain-specific processing
  ChatContext context = 4;

  // Conversation history (passed from Next.js database)
  repeated HistoryMessage conversation_history = 5;

  // Tools for ToolCallingAgent execution (can be empty)
  repeated ToolConfig tools = 6;

  string model = 7;                  // Optional: model override for this chat message

  string message_id = 8;             // Unique message identifier for cancellation
}

// Streaming response from AI processing
message ProcessMessageResponse {
  // Standard oneof pattern for different response types
  oneof response {
    ContentChunk content_chunk = 1;    // AI-generated streaming content
    RagContext rag_context = 2;       // RAG sources and context
    ProcessingComplete complete = 3;   // Processing finished marker
    ProcessingError error = 4;        // Processing error
    StepProgress step_progress = 5;   // Real-time step execution progress
  }

  int64 timestamp = 6;               // Response timestamp
}

// Simple conversation history message (passed TO gRPC, not managed BY it)
message HistoryMessage {
  string role = 1;                   // user, assistant, system
  string content = 2;                // message content
  int64 timestamp = 3;               // when it was created
}

// Streaming content chunk
message ContentChunk {
  string content = 1;                // Text content chunk
  int32 sequence = 2;                // Sequence number for ordering
}

// RAG context information
message RagContext {
  repeated RagSource sources = 1;    // List of RAG sources used
  string context_summary = 2;        // Summary of context used
  int32 total_sources = 3;           // Total number of sources found
}

message RagSource {
  string document_id = 1;            // Source document identifier
  string title = 2;                  // Source document title
  float similarity = 3;              // Similarity score
  string domain_type = 4;            // Domain type (table, agent, file, etc.)
  string excerpt = 5;                // Relevant text excerpt
}

// Processing completion marker
message ProcessingComplete {
  string model_used = 1;             // AI model used for generation (deprecated - use token_usage.model_name)
  int32 total_tokens = 2;            // Total tokens processed (deprecated - use token_usage.total_tokens)
  int32 processing_time_ms = 3;      // Processing time in milliseconds
  map<string, string> metadata = 4;  // Additional processing metadata
  TokenUsage token_usage = 5;        // Detailed token usage and cost tracking
}

// Processing error information
message ProcessingError {
  string error_code = 1;             // Error code (RAG_FAILED, MODEL_ERROR, etc.)
  string error_message = 2;          // Human-readable error message
  map<string, string> error_details = 3; // Additional error context
}

// Real-time step execution progress (for stream=True agent execution)
message StepProgress {
  StepType step_type = 1;            // Type of step being executed
  string step_name = 2;              // Human-readable step description
  string content = 3;                // Step content/output
  map<string, string> metadata = 4;  // Additional step metadata (tool name, arguments, etc.)
  int32 step_index = 5;              // Step sequence number (0-indexed)
}

// Types of execution steps during agent processing
enum StepType {
  STEP_PLANNING = 0;     // Agent is planning next action
  STEP_ACTION = 1;       // Agent is executing a tool/action
  STEP_REASONING = 2;    // Agent is reasoning about results
  STEP_FINAL = 3;        // Agent has reached final answer
}

// Request to cancel an in-progress message
message CancelMessageRequest {
  string message_id = 1;             // Message identifier to cancel
  string user_id = 2;                // User requesting cancellation (for authorization)
  int32 organization_id = 3;         // Organization context
}

// Response to message cancellation request
message CancelMessageResponse {
  bool success = 1;                  // Whether cancellation was successful
  string message = 2;                // Status message
}

// Chat context configuration for AI processing
message ChatContext {
  string domain_type = 1;            // Domain type (table, agent, file, team, workflow)
  int32 domain_id = 2;               // Domain entity identifier
  bool enable_rag = 3;               // Enable RAG context retrieval
  float rag_threshold = 4;           // RAG similarity threshold (default: 0.3)
  int32 max_rag_docs = 5;            // Maximum RAG documents to retrieve (default: 5)
  float primary_rag_weight = 6;      // Weight for domain-specific RAG (default: 0.7)
  string assembled_rag_context = 7;  // Pre-assembled RAG context from Next.js DualContextRagService
  repeated string rag_sources = 8;   // RAG source summary for metadata
}