syntax = "proto3";

package emery.agents;

// Service for executing agent tasks on worker instances
service AgentWorker {
  // Execute a task and stream progress updates back to the API server
  rpc ExecuteTask(TaskRequest) returns (stream TaskProgress);

  // Get worker health status and available skills
  rpc GetWorkerInfo(Empty) returns (WorkerInfo);
  
  // Cancel a running task
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

// Request to execute a specific agent task
message TaskRequest {
  string task_id = 1;              // Unique task identifier
  int32 agent_id = 2;              // Agent to execute the task
  oneof execution_mode {
    string skill_name = 3;          // Direct skill execution
    InstructionConfig instruction_config = 9; // Instruction-based execution with auto-routing
  }
  AgentConfig agent_config = 4;    // Complete agent configuration
  TriggerData trigger_data = 5;    // Structured trigger data
  string organization_id = 6;      // Organization for multi-tenant routing
  string owner_id = 7;             // Agent owner ID for OAuth credentials
  int32 timeout_seconds = 8;       // Task execution timeout (default: 300)
  string name = 10;
  string agent_model = 11;         // Agent default model (overrides organization model in hierarchy)
  string organization_model = 12;  // Organization default model (fallback for agent model)
  repeated MessagePart input_content = 13; // Runtime input attachments for skill execution
  ResolvedContextProto resolved_context = 14; // Context table mappings for this execution
}

// AIDEV-NOTE: Simplified for single-instruction execution (removed step_id and step_type)
// Streaming progress updates during task execution
message TaskProgress {
  string task_id = 1;              // Task being updated
  TaskStatus status = 2;           // Current task status
  string output_json = 5;          // Execution output data as JSON
  string error_message = 6;        // Error details if failed
  int64 timestamp_ms = 7;          // Update timestamp
  float progress_percent = 8;      // Completion percentage (0-100)
  TokenUsage token_usage = 9;      // Token usage for this task (set when completed)
}

// Task execution status enum
enum TaskStatus {
  TASK_PENDING = 0;
  TASK_IN_PROGRESS = 1;
  TASK_COMPLETED = 2;
  TASK_FAILED = 3;
  TASK_CANCELLED = 4;
  TASK_TIMEOUT = 5;
}

// Request to cancel a running task
message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;               // Optional cancellation reason
}

// Response to task cancellation request
message CancelTaskResponse {
  bool success = 1;
  string message = 2;
}

// Worker health and skill information
message WorkerInfo {
  string worker_id = 1;            // Unique worker instance ID
  string version = 2;              // Worker software version
  string organization_id = 3;      // Organization this worker serves
  WorkerStatus status = 4;         // Current worker status
  repeated string skills = 5;      // Available agent skills
  int32 active_tasks = 6;          // Number of currently running tasks
  int32 max_concurrent_tasks = 7;  // Maximum concurrent task capacity
  int64 uptime_seconds = 8;        // Worker uptime
  repeated string supported_tools = 9; // Available MCP tools
}

// Worker health status
enum WorkerStatus {
  WORKER_HEALTHY = 0;
  WORKER_BUSY = 1;
  WORKER_DEGRADED = 2;
  WORKER_UNHEALTHY = 3;
  WORKER_SHUTTING_DOWN = 4;
}

// Empty message for requests with no parameters
message Empty {}

// Standard error response
message ErrorResponse {
  string code = 1;                 // Error code (e.g., "TASK_NOT_FOUND")
  string message = 2;              // Human-readable error message
  string details = 3;              // Additional error details
}

// Token usage tracking for billing
message TokenUsage {
  string model_name = 1;             // Model used for this operation
  int32 input_tokens = 2;            // Input/prompt tokens consumed
  int32 output_tokens = 3;           // Output/completion tokens generated
  int32 total_tokens = 4;            // Total tokens (input + output)
  double cost_usd = 5;               // Estimated cost in USD
}
// Complete agent configuration
message AgentConfig {
  string name = 1;
  string role = 2;
  string description = 3;
  string persona = 4;
  repeated ToolConfig tools = 5;
  repeated ServerConfig servers = 6;
  repeated SkillConfig skills = 7;
  string default_model = 8;              // Agent-specific default model (overrides organization default)
}

// AIDEV-NOTE: Simplified single-instruction skill model (removed multi-step workflow)
// Skill configuration with single instruction block
message SkillConfig {
  int32 id = 1;                        // Skill ID for unique identification
  string name = 2;
  string description = 3;
  repeated InputDefinition inputs = 4;   // Unified input definitions (replaces SkillInput)
  repeated OutputDefinition outputs = 5; // Unified output definitions (replaces SkillOutput)
  string instructions = 6;
  repeated ToolConfig tools = 7;
  string model = 8;                    // Optional: model override for this skill
  repeated MessagePart content = 9;    // Skill-level attachments (images, files, text)
  string agent_type = 10;              // Optional: "tool_calling" (default) or "code_agent"
  string execution_type = 11;          // 'agentic', 'agent' (step-based DAG), 'operation', 'tool', 'write', or 'read'
  TaskModelConfig task_model_config = 12; // Config for operation execution (when execution_type='operation')
  ToolExecutionConfig tool_execution_config = 13; // Config for tool execution (when execution_type='tool')
  WriteConfig write_config = 14;       // Config for write execution (when execution_type='write')
  ReadConfig read_config = 15;         // Config for read execution (when execution_type='read')
  repeated SkillStep steps = 20;       // Steps for step-based execution (when execution_type='agent')
}

// =============================================================================
// Input Mapping Types (read from tables into skill inputs)
// =============================================================================

// Source for reading a value from a table field
message InputFieldSource {
  int32 table_id = 1;           // Which table to read from
  int32 field_id = 2;           // Which field to read
  RowIdSource row_source = 3;   // Which row (reuses existing RowIdSource)
}

// Input mapping configuration - maps table field to skill input
message InputMappingConfig {
  InputFieldSource source = 1;
}

// =============================================================================
// Unified Definition Types (used for skill-level AND step-level)
// =============================================================================

// Unified input definition
message InputDefinition {
  string name = 1;
  bool required = 2;
  string type = 3;  // text, number, boolean, json, image, file, audio, etc.
  InputMappingConfig input_mapping = 4;  // Optional: read from table field
}

// Output source - where skill output value comes from (node output mapping)
message OutputSource {
  string type = 1;           // "node_output"
  string node_id = 2;        // Step/node name that produces this output
  string output_name = 3;    // Output name from node's output_defs
}

// Unified output definition
message OutputDefinition {
  string name = 1;
  string type = 2;
  OutputMappingConfig output_mapping = 3;  // Optional: write to table fields
  string description = 4;                   // Description for LLM guidance
  OutputSource source = 5;                  // Where skill output value comes from
}

// =============================================================================
// DAG Execution Configuration Types
// =============================================================================

// Error handling configuration for a step
message ErrorConfig {
  bool continue_on_error = 1;          // Continue execution even if step fails
  string error_output_var = 2;         // Variable name to store error details (e.g., "__error__")
}

// Retry configuration for error recovery
message RetryConfig {
  int32 max_attempts = 1;              // Max retry attempts (default: 3)
  int32 backoff_ms = 2;                // Initial backoff in milliseconds (default: 1000)
  string backoff_type = 3;             // "fixed", "exponential", "linear" (default: "exponential")
}

// Step output routing - determines which steps to execute based on outcome
// Enables n8n-style branching: success path, error path, conditional paths
message StepOutput {
  string type = 1;                     // "success", "error", "condition", "default"
  string condition = 2;                // For type="condition": expression like "{{result}} > 100"
  repeated string next_steps = 3;      // Step names to execute for this output
}

// Loop configuration for iteration support
// Enables for-each over arrays and while/until conditional loops
message LoopConfig {
  string type = 1;                     // "for_each", "while", "until"
  string items_var = 2;                // For for_each: variable containing array to iterate
  string current_item_var = 3;         // Variable name to store current item (default: "item")
  string condition = 4;                // For while/until: condition expression "{{count}} < 10"
  int32 max_iterations = 5;            // Safety limit to prevent infinite loops (default: 100)
}

// Step definition for step-based skill execution (execution_type='agent')
// Each step can either have inline instructions OR reference another skill
message SkillStep {
  string id = 20;                      // Stable UUID for references (used for step_context keys)
  string name = 1;                     // Step display name (user-editable)
  string instruction = 2;              // Inline instruction (if not referencing a skill)
  int32 skill_id = 3;                  // OR reference to another skill by ID
  repeated string tools = 4;           // Tools available for this step (for inline instruction)
  map<string, string> inputs = 5;      // Input mappings: param_name -> "{{source_var}}" or literal
  map<string, string> outputs = 6;     // Output mappings: output_name -> target_var_name
  bool parallel = 7;                   // Can run in parallel with previous step (future)
  string condition = 8;                // Optional condition: "{{var}} > 0" (skip step if false)
  // Step-level definitions (simpler types than skill-level)
  repeated InputDefinition input_defs = 9;   // What this step accepts
  repeated OutputDefinition output_defs = 10; // What this step produces
  // DAG execution configuration
  ErrorConfig error_config = 11;       // Error handling (continue_on_error, error variable)
  RetryConfig retry_config = 12;       // Retry configuration for transient failures
  // Output routing for DAG branching (n8n-style)
  repeated StepOutput step_outputs = 13; // Output paths: success, error, conditional branches
  // Parallel execution
  string parallel_group = 14;          // Steps with same group ID execute concurrently
  // Loop/iteration support
  LoopConfig loop_config = 15;         // For-each, while, until loops
  // Step-level execution configs (for non-agentic steps)
  ReadConfig read_config = 16;         // For read steps
  WriteConfig write_config = 17;       // For write steps
  ToolExecutionConfig tool_execution_config = 18; // For tool steps
  TaskModelConfig task_model_config = 19; // For operation steps
  // UI state
  bool is_disabled = 21;               // Step can be disabled without deletion
  // Agentic step configuration (for nodeType='agentic')
  AgenticStepConfig agentic_config = 22;
}

// Configuration for agentic step execution (nodeType='agentic')
// AIDEV-NOTE: plan field enables autonomous execution - when present, HITL is bypassed
message AgenticStepConfig {
  string instructions = 1;             // Instructions for the agent
  repeated ToolConfig tools = 2;       // Tools available for this agentic step
  string agent_type = 3;               // "tool_calling" (default) or "code_agent"
  string model = 4;                    // Optional model override
  StoredPlan plan = 5;                 // Stored execution plan for autonomous execution
}

// =============================================================================
// Stored Plan Types (for autonomous execution)
// =============================================================================

// Stored execution plan for autonomous execution
// AIDEV-NOTE: When present on agentic step, execution skips HITL and runs autonomously.
// Contains execution blueprint from successful HITL planning session.
message StoredPlan {
  string id = 1;                       // Plan identifier
  string goal = 2;                     // High-level goal from user request
  string basic_instructions = 3;       // Original instructions
  string context = 4;                  // Discovered context (databases, tables)
  string analysis = 5;                 // LLM reasoning about approach
  repeated StoredPlanStep steps = 6;   // Execution steps
  int32 version = 7;                   // Plan version
  string generated_at = 8;             // When plan was generated (ISO timestamp)
  string approved_at = 9;              // When plan was approved (ISO timestamp)
}

// Individual step within a stored plan
// Contains execution details without runtime state (status, result, error)
message StoredPlanStep {
  string step_id = 1;                  // Step identifier
  string description = 2;              // Step description
  string tool_call = 3;                // Tool to call (e.g., "row_crud:read")
  map<string, string> parameters = 4;  // Tool parameters
  repeated string context_tables = 5;  // Tables this step needs access to
  string target_agent = 6;             // Managed agent for routing (e.g., "schema_builder")
  StoredSubPlan sub_plan = 7;          // Sub-plan from cascading planning
}

// Sub-plan from cascading planning
// Generated when a managed agent creates detailed execution steps
message StoredSubPlan {
  string agent_name = 1;               // Target agent name
  string goal = 2;                     // Sub-goal for this agent
  repeated StoredPlanStep steps = 3;   // Sub-plan steps
  string planning_observations = 4;    // Observations from planning phase
}

// Configuration for operation execution (direct model invocation without LLM orchestration)
message TaskModelConfig {
  string model_id = 1;                 // HuggingFace model ID (e.g., 'black-forest-labs/FLUX.1-schnell')
  string task_type = 2;                // Task type: text-to-image, speech-to-text, etc.
  map<string, string> parameters = 3;  // Model-specific parameters (steps, guidance_scale, etc.)
}

// Configuration for direct tool execution (when execution_type='tool')
// Calls a Pipedream tool directly without LLM orchestration
message ToolExecutionConfig {
  string tool_id = 1;                  // Pipedream tool ID (e.g., 'gmail-send-email', 'slack-send-message')
  repeated ToolInputMapping input_mappings = 2; // Map skill inputs to tool parameters
  optional int32 output_table_id = 3;  // Table to store outputs (schema auto-discovered from response)
}

// Maps skill input to tool parameter
message ToolInputMapping {
  string tool_param = 1;               // Tool parameter name
  string skill_input_name = 2;         // Skill input to use (if set)
  string static_value = 3;             // Static value (used if skill_input_name not set)
}

// Configuration for direct table write (when execution_type='write')
// Writes data directly to a table without LLM orchestration
message WriteConfig {
  int32 target_table_id = 1;           // Table to write to
  string row_action = 2;               // 'create' or 'update'
  repeated WriteFieldMapping field_mappings = 3; // Map skill inputs to table fields
  UpdateMatchConfig update_match = 4;  // For update: which field to match
}

// Maps skill input to table field
message WriteFieldMapping {
  string skill_input_name = 1;         // Skill input name
  int32 target_field_id = 2;           // Table field ID
}

// Configuration for matching rows during update
message UpdateMatchConfig {
  string skill_input_name = 1;         // Skill input with match value
  int32 target_field_id = 2;           // Field to match against
}

// Configuration for direct table read (when execution_type='read')
// Reads data from a table without LLM orchestration
message ReadConfig {
  string mode = 1;                     // 'single_row' or 'query'
  int32 source_table_id = 2;           // Table to read from
  RowIdSource row_id_source = 3;       // For single_row mode: which row to read
  repeated QueryFilter query_filters = 4; // For query mode: filter conditions
  int32 query_limit = 5;               // For query mode: max rows to return (default: 100)
  repeated ReadFieldMapping field_mappings = 6; // Map table fields to output variables
}

// Filter condition for query mode reads
message QueryFilter {
  int32 field_id = 1;                  // Field to filter on
  string operator = 2;                 // 'equals', 'not_equals', 'contains', 'gt', 'lt', 'gte', 'lte', 'is_empty', 'is_not_empty'
  RowIdSource value_source = 3;        // Source for filter value (reuses RowIdSource for flexibility)
}

// Maps table field to output variable
message ReadFieldMapping {
  int32 source_field_id = 1;           // Table field ID to read from
  string target_variable = 2;          // Output variable name to store value
}

// NOTE: SkillInput, SkillOutput, SkillInputFileConfig removed - replaced by unified InputDefinition/OutputDefinition

// Target field metadata - provides LLM guidance based on database field type
message TargetFieldMetadata {
  string field_type = 1;               // Database field type: "single-select", "multi-select", "number", "boolean", etc.
  repeated string options = 2;         // For select fields: valid option values
  optional int32 max_selections = 3;   // For multi-select: maximum allowed selections
  optional string field_name = 4;      // Target field name (for display)
}

// =============================================================================
// Multi-Table Output Mapping Types (typed references, no string parsing)
// =============================================================================

// Reference to a field from a previous table mapping result
message TableReference {
  int32 order = 1;                     // Which table mapping (1, 2, 3...)
  string field = 2;                    // 'row_id' or field name from that table
}

// Typed field source - skill output, skill input, or reference to previous table
message FieldSource {
  oneof source {
    string skill_output = 1;           // Direct skill output name (e.g., "company_name")
    TableReference table_ref = 2;      // Reference to previous table operation result
    string skill_input = 3;            // Direct skill input name (e.g., "patient_id")
  }
}

// Source for row ID in update mode - determines which row to update
message RowIdSource {
  oneof source {
    string static_id = 1;              // Hardcoded row ID
    string skill_input = 2;            // Name of skill input containing row ID
    string skill_output = 3;           // Name of skill output containing row ID
    TableReference table_ref = 4;      // Reference to previous table (e.g., row_id from Table #1)
    bool use_source_row = 5;           // Use the triggering row's ID (for table-triggered skills)
  }
}

// Field mapping within a table mapping - maps a typed source to a target field
message FieldMapping {
  FieldSource source = 1;              // Where to get the value (typed)
  int32 target_field_id = 2;           // Which field to write to
  TargetFieldMetadata target_field_metadata = 3;  // Optional: target field info for LLM guidance
  bool append_mode = 4;                // When true, append to existing relation values instead of replacing
}

// Ordered operation for a single table
message TableMapping {
  int32 order = 1;                     // Execution order (1, 2, 3...)
  int32 target_table_id = 2;           // Which table to write to
  string row_action = 3;               // 'create' or 'update'
  RowIdSource row_id_source = 4;       // For update mode - typed source for row ID
  repeated FieldMapping mappings = 5;  // Field mappings for this table
  int32 display_field_id = 6;          // Field to use for relation display value
  string mode = 7;                     // Per-table mode: 'single_row' or 'multi_row'
}

// Output mapping configuration - multi-table support with typed references
message OutputMappingConfig {
  string mode = 1;                     // Default mode: 'single_row' or 'multi_row' (used if table doesn't specify)
  repeated TableMapping table_mappings = 2;  // Ordered table operations
}

// Tool configuration
message ToolConfig {
  string name = 1;
  string version = 2;
  map<string, string> config = 3;
}

// Server configuration
message ServerConfig {
  string name = 1;
  string endpoint = 2;
  map<string, string> config = 3;
}

// Runtime skill input value with type information
// AIDEV-NOTE: This enables type-safe skill input passing from TypeScript to Python
message SkillInputValue {
  string name = 1;           // Input name (matches SkillInput.name from skill definition)
  string type = 2;           // Type from SkillInput definition (text, number, boolean, etc.)
  oneof value {
    string string_value = 3;   // For text, email, phone, date (ISO string), single-select
    double number_value = 4;   // For number types
    bool bool_value = 5;       // For boolean types
    string json_value = 6;     // For json, multi-select (array), file refs, complex objects
  }
}

// Trigger data with typed skill inputs
message TriggerData {
  repeated SkillInputValue skill_inputs = 1;    // Typed skill input values
}

// AIDEV-NOTE: Task instruction format aligned with smolagents API
// - task: Main text instruction → agent.run(task=...)
// - images: Image URLs → downloaded → agent.run(images=[PIL.Image, ...])
// - attachments: File metadata (preprocessed to text, already in task field)
message InstructionConfig {
  string task = 1;                          // Main instruction text (required)
  repeated ImageAttachment images = 2;       // Image URLs (optional)
  repeated FileAttachment attachments = 3;   // File metadata (optional, for tracking)
  repeated ToolConfig tools = 4;             // Optional tools for this task
  repeated ServerConfig servers = 5;         // Optional servers for this task
  string model = 6;                          // Optional: model override for this instruction
}

// Image attachment for task instructions
message ImageAttachment {
  string url = 1;      // S3 pre-signed URL or HTTP URL
  string s3_key = 2;   // S3 key for reference (optional)
}

// File attachment metadata (files are preprocessed to text)
message FileAttachment {
  string type = 1;        // pdf, audio, document, text
  string url = 2;         // S3 pre-signed URL
  string filename = 3;    // Original filename
  string mime_type = 4;   // MIME type
}

// gRPC Chat Processing Service - AI operations only (stateless)
service ChatProcessingService {
  // Process a message and stream AI response (no database operations)
  rpc ProcessMessage(ProcessMessageRequest) returns (stream ProcessMessageResponse);

  // Cancel an in-progress message processing
  rpc CancelMessage(CancelMessageRequest) returns (CancelMessageResponse);
}

// Request for AI message processing
message ProcessMessageRequest {
  // Input message for AI processing (multimodal support)
  repeated MessagePart message_parts = 1;  // User message content as structured parts (text + images)

  string user_id = 2;                // User identifier for context
  int32 organization_id = 3;         // Organization for multi-tenant routing

  // Context for RAG and domain-specific processing
  ChatContext context = 4;

  // Conversation history (only used if session not in memory - for restoration after restart/timeout)
  repeated HistoryMessage conversation_history = 5;

  // Complete agent configuration (tools, skills, servers)
  AgentConfig agent_config = 6;

  string model = 7;                  // Optional: model override for this chat message

  string message_id = 8;             // Unique message identifier for cancellation

  string session_id = 9;             // Required: session identifier (chat_id from database)

  string user_api_key = 10;          // User API key for internal service calls (skill_builder, etc.)
}

// Streaming response from AI processing
message ProcessMessageResponse {
  // Standard oneof pattern for different response types
  oneof response {
    ContentChunk content_chunk = 1;    // AI-generated streaming content
    // Field 2 reserved (was: RagContext rag_context)
    ProcessingComplete complete = 3;   // Processing finished marker
    ProcessingError error = 4;        // Processing error
    StepProgress step_progress = 5;   // Real-time step execution progress
    AwaitingInput awaiting_input = 7; // HITL: Agent needs user approval/input
  }

  int64 timestamp = 6;               // Response timestamp
}

// HITL: Agent awaiting user input (plan approval or question)
// AIDEV-NOTE: Used for both plan approval and agent questions.
// - plan_approval: Shows plan + Approve/Reject/Modify buttons
// - question: Shows question + option buttons for user choice
message AwaitingInput {
  string input_type = 1;             // "plan_approval" or "question"
  string title = 2;                  // Display title
  string content = 3;                // Plan markdown or question text
  repeated InputOption options = 4;  // Available options for user to choose
  string plan_json = 5;              // Full plan JSON (for plan_approval type)
}

// Option for HITL questions/choices
message InputOption {
  string id = 1;                     // Unique option identifier
  string label = 2;                  // Display text
  string description = 3;            // Optional description
}

// Multimodal message part (text, image, or file attachment)
// AIDEV-NOTE: Multi-attachment support implemented (2025-01)
// - ImageUrlPart: Vision model support (PIL Images → base64)
// - FilePart: Text extraction from PDFs, audio transcription, documents
// - Files processed async in message_mapper.py using file_processor.py
message MessagePart {
  oneof part {
    TextPart text = 1;
    ImageUrlPart image_url = 2;
    FilePart file = 3;                // Generic file attachment (PDF, audio, documents, etc.)
  }
}

message TextPart {
  string text = 1;
}

message ImageUrlPart {
  string url = 1;                    // Image URL (HTTP URL or S3 pre-signed URL)
}

message FilePart {
  string url = 1;                    // File URL (S3 pre-signed URL)
  string mime_type = 2;              // MIME type (application/pdf, audio/mpeg, etc.)
  string filename = 3;               // Original filename
  int64 size = 4;                    // File size in bytes
}

// Conversation history message with multimodal support
message HistoryMessage {
  string role = 1;                   // user, assistant, system
  repeated MessagePart content_parts = 2;  // Message content as structured parts (text + images)
  int64 timestamp = 3;               // when it was created
}

// Streaming content chunk
message ContentChunk {
  string content = 1;                // Text content chunk
  int32 sequence = 2;                // Sequence number for ordering
}

// Processing completion marker
message ProcessingComplete {
  string model_used = 1;             // AI model used for generation (deprecated - use token_usage.model_name)
  int32 total_tokens = 2;            // Total tokens processed (deprecated - use token_usage.total_tokens)
  int32 processing_time_ms = 3;      // Processing time in milliseconds
  map<string, string> metadata = 4;  // Additional processing metadata
  TokenUsage token_usage = 5;        // Detailed token usage and cost tracking
}

// Processing error information
message ProcessingError {
  string error_code = 1;             // Error code (rate_limit, input_too_large, etc.)
  string error_message = 2;          // User-friendly error message (no technical details)
  map<string, string> error_details = 3; // Additional error context
  // Error recovery metadata
  string hint = 4;                   // Actionable hint for user (optional)
  bool can_retry = 5;                // Can user retry this operation?
  bool auto_retry = 6;               // Was this error auto-retried?
  bool session_reset = 7;            // Was session reset due to this error?
}

// Real-time step execution progress (for stream=True agent execution)
message StepProgress {
  StepType step_type = 1;            // Type of step being executed
  string step_name = 2;              // Human-readable step description
  string content = 3;                // Step content/output
  map<string, string> metadata = 4;  // Additional step metadata (tool name, arguments, etc.)
  int32 step_index = 5;              // Step sequence number (0-indexed)
}

// Types of execution steps during agent processing
enum StepType {
  STEP_PLANNING = 0;     // Agent is planning next action
  STEP_ACTION = 1;       // Agent is executing a tool/action
  STEP_REASONING = 2;    // Agent is reasoning about results
  STEP_FINAL = 3;        // Agent has reached final answer
}

// Request to cancel an in-progress message
message CancelMessageRequest {
  string message_id = 1;             // Message identifier to cancel
  string user_id = 2;                // User requesting cancellation (for authorization)
  int32 organization_id = 3;         // Organization context
}

// Response to message cancellation request
message CancelMessageResponse {
  bool success = 1;                  // Whether cancellation was successful
  string message = 2;                // Status message
}

// Chat context configuration for AI processing
message ChatContext {
  string domain_type = 1;            // Domain type (tables, agents, files, teams, workflows)
  int32 domain_id = 2;               // Domain entity identifier
}

// =============================================================================
// Context Mapping Types (for agent/skill/step context tables)
// =============================================================================

// Context table mapping for agent execution
// Defines which tables are accessible and with what permissions
message ContextMappingProto {
  int32 table_id = 1;                // Table ID
  string table_name = 2;             // Table name (for display/logging)
  string access_mode = 3;            // "read", "write", or "readwrite"
  string sync_mode = 4;              // "on_access", "on_save", or "realtime"
  string target_type = 5;            // "agent", "skill", or "skill_step"
  string target_id = 6;              // Target entity ID
}

// Resolved context mappings for execution
// Contains merged mappings with hierarchy priority applied (step > skill > agent)
message ResolvedContextProto {
  repeated ContextMappingProto mappings = 1;           // All mappings (merged)
  repeated ContextMappingProto agent_mappings = 2;     // Agent-level mappings
  repeated ContextMappingProto skill_mappings = 3;     // Skill-level mappings
  repeated ContextMappingProto step_mappings = 4;      // Step-level mappings
}