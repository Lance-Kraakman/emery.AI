[project]
name = "emery-agents"
version = "0.1.0"
description = "Agent execution system for Emery with smolagents and MCP integration"
authors = [
    { name = "Lance Kraakman", email = "lance@aifactory.nz" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "aiohttp>=3.8.0",
    "schedule>=1.2.0",
    "python-crontab>=3.0.0",
    "websockets>=11.0.0",
    "httpx>=0.25.0",
    "typing-extensions>=4.8.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "smolagents>=1.20.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.1.1",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "Pillow>=10.0.0",
    "requests>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]
# MLX features only available on macOS (Apple Silicon)
macos = [
    "smolagents[dev]>=1.20.0",
]
# Full smolagents with all features for compatible platforms
full = [
    "smolagents[dev]>=1.20.0",
    "mlx>=0.28.0; sys_platform == 'darwin'",
    "mlx-lm>=0.26.1; sys_platform == 'darwin'",
]
all = [
    "emery-agents[dev]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emery_agents"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "smolagents: marks tests that require smolagents and HF_TOKEN",
    "grpc: marks tests that require gRPC dependencies"
]

[project.scripts]
emery-worker = "emery_agents.grpc.main:main"
