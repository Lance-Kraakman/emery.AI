[project]
name = "emery-agents"
version = "0.1.0"
description = "Agent execution system for Emery with DSPy and MCP integration"
authors = [
    { name = "Lance Kraakman", email = "lance@aifactory.nz" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "aiohttp>=3.8.0",
    "schedule>=1.2.0",
    "python-crontab>=3.0.0",
    "websockets>=11.0.0",
    "httpx>=0.25.0",
    "typing-extensions>=4.8.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=6.0.0",
    "modal>=0.64.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.1.1",
    "Pillow>=10.0.0",
    "requests>=2.30.0",
    # Database and data dependencies
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    # Delta Lake and data processing dependencies
    "deltalake>=0.15.0,<1.3.0",  # 1.3.0 lacks aarch64 wheel
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "pymupdf>=1.26.6",
    # MPC dependencies
    "do-mpc>=1.3.0",
    "casadi>=3.6.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.34.3",
    "google-genai>=1.0.0",  # Google Gemini SDK for embeddings
    "tenacity>=8.2.0",
    "simpleeval>=1.0",  # Safe expression evaluation for workflow conditions
    "ddgs>=6.0.0",  # Required for DuckDuckGoSearchTool in research agent
    "markdownify>=0.12.0",  # Required for VisitWebpageTool HTML→markdown conversion
    "boto3>=1.34.0",  # AWS SDK for S3 workspace sync
    "dspy-ai>=2.5.0",  # DSPy for declarative LM programming
    "langgraph>=0.2.0",  # LangGraph for agent orchestration
    "langgraph-checkpoint>=2.0.0",  # LangGraph checkpointing
    "python-docx>=1.0.0",  # Word document text extraction
    "openpyxl>=3.1.0",  # Excel spreadsheet text extraction
    "mem0ai>=0.1.0",  # mem0 for persistent semantic memory with entity extraction
    "chromadb>=0.4.0",  # Required by mem0 for Chroma vector store backend
    "presidio-analyzer>=2.2.0",  # PII detection for agent memory
    "presidio-anonymizer>=2.2.0",  # PII anonymization for agent memory
    "redis>=5.0.0",  # Redis client for Delta Lake write buffer
    "faiss-cpu>=1.7.0",  # FAISS for vector search in KnowledgeBase
    "duckdb==1.2.2",  # Pinned: duckpgq ARM64 community extension ends at v1.2.2
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
    "black>=23.11.0",
    "ruff>=0.9.0",
]
# MLX features only available on macOS (Apple Silicon)
macos = [
    "mlx>=0.28.0; sys_platform == 'darwin'",
    "mlx-lm>=0.26.1; sys_platform == 'darwin'",
]
all = [
    "emery-agents[dev]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emery_agents"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
    "black>=23.11.0",
    "ruff>=0.9.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (includes F401 unused imports)
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (modern Python syntax)
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top (sometimes intentional)
    "E741",   # Ambiguous variable name (sometimes intentional, e.g., 'l' for list)
    "UP042",  # Class inherits from both str and Enum (StrEnum requires 3.11+, keep for compatibility)
    "UP007",  # Use X | Y for type annotations (requires unsafe fix for Union aliases)
    "SIM102", # Nested if statements (sometimes clearer)
    "SIM103", # Return condition directly (sometimes clearer to be explicit)
    "SIM105", # Use contextlib.suppress (sometimes try/except is clearer)
    "SIM108", # Use ternary operator (readability preference)
    "SIM110", # Use any/all (sometimes explicit loop is clearer)
    "SIM117", # Use single with statement (sometimes separate is clearer)
    "SIM118", # Use key in dict (not key in dict.keys())
    "B904",   # raise without from in except (too noisy, fix incrementally)
    "B905",   # zip without strict= (Python 3.10+, not always needed)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"*_pb2*.py" = ["E", "F", "I", "UP"]  # Generated protobuf files

[tool.ruff.lint.isort]
known-first-party = ["emery_agents"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "grpc: marks tests that require gRPC dependencies",
    "real_execution: marks tests that execute real agents with AI models",
    "slow: marks tests that take a long time to execute (30s+)"
]

[project.scripts]
emery-worker = "emery_agents.grpc.server:main"
