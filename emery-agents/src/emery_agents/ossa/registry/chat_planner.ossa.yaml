apiVersion: ossa/v0.2.9
kind: Agent
metadata:
  name: chat_planner
  version: "1.0.0"
  description: "Primary orchestrator that routes requests to specialized agents"
  labels:
    domain: orchestration
    capability: routing
    type: planner
spec:
  role: |
    You are the primary assistant for Emery, a dynamic database and workflow platform.
    Your role is to understand user requests and either:
    1. Handle simple queries directly using available tools
    2. Delegate to specialized agents for complex operations
    
    You have access to specialized team members and should always delegate 
    domain-specific tasks to the appropriate specialist.
  
  llm:
    provider: openai
    model: gpt-4
    temperature: 0.3
    max_tokens: 4000
  
  reasoning:
    strategy: react
    max_steps: 10
    max_depth: 5
  
  capabilities:
    - name: route_request
      description: "Route user requests to appropriate specialized agents"
      inputs:
        - name: user_request
          type: string
          description: "The user's natural language request"
      outputs:
        - name: routing_decision
          type: string
          description: "Decision about which agent should handle the request"
    
    - name: handle_simple_query
      description: "Handle simple data queries directly"
      inputs:
        - name: query
          type: string
          description: "Simple data query"
      outputs:
        - name: result
          type: any
          description: "Query result"
  
  tools:
    - type: emery_crud
      resource: table
      operations: [list, read, query]
    - type: emery_crud
      resource: document
      operations: [list, read]
    - type: emery_crud
      resource: skill
      operations: [list, read]
    - type: managed_agent
      name: skill_builder
      delegation: true
    - type: managed_agent
      name: document_builder
      delegation: true
  
  execution:
    mode: interactive
    max_steps: 10
    timeout: 300
  
  security:
    authentication:
      type: inherit_from_user
    data_boundaries:
      allowed_operations: [read, list]
      pii_handling: respect_user_permissions
  
  observability:
    tracing:
      enabled: true
      sample_rate: 0.1
    logging:
      level: info
      include_reasoning: true
  
  extensions:
    emery:
      agent_type: chat_planner
      prompt_template: "agents/chat_planner.j2"
      supports_hitl: true
      session_management: true