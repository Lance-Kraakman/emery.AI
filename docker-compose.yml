# Docker Compose for local development
# Start services: docker compose up -d
# Stop services: docker compose down

services:
  # Redis for distributed rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: emery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: emery-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: emery
      MINIO_ROOT_PASSWORD: dashlet123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: emery-postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dashlet
      POSTGRES_DB: emery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SFTP server for workspace sync (local development)
  # Connect: sftp -P 2222 agent@localhost (password: test123)
  # Maps to same workspace-data volume as agents use
  sftp:
    image: atmoz/sftp
    container_name: emery-sftp
    ports:
      - "2222:22"
    volumes:
      - workspace-data:/home/agent/workspace
    # Format: user:password:uid:gid:dir
    command: "agent:test123:1000:1000:workspace"

volumes:
  redis-data:
  minio-data:
  postgres-data:
  # Shared workspace storage for agent/frontend
  # Mount with: volumes: - workspace-data:/mnt/storage/workspaces
  # Set env: WORKSPACE_STORAGE_PATH=/mnt/storage/workspaces
  workspace-data:
