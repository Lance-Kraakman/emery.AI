version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: dashlet
      POSTGRES_DB: orchastrate
      POSTGRES_USER: postgres
    volumes:
      - db:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d

volumes:
  db: