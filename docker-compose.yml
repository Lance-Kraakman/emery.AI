services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: dashlet
      POSTGRES_DB: emery
      POSTGRES_USER: postgres
    volumes:
      - db:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emery"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: emery
      MINIO_ROOT_PASSWORD: dashlet123
    volumes:
      - minio:/data
    command: server /data --console-address ":9001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
      - .env.local
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:50052:50052"
    env_file:
      - .env.docker
    command: "scheduler"
    depends_on:
      - db

  agent:
    build:
      context: ./emery-agents
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
    env_file:
      - .env.docker
    environment:
      S3_BUCKET_NAME: "emery-local"
    depends_on:
      - db

volumes:
  db:
  minio:
