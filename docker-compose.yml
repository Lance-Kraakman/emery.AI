services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: dashlet
      POSTGRES_DB: emery
      POSTGRES_USER: postgres
    volumes:
      - db:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: emery
      MINIO_ROOT_PASSWORD: dashlet123
    volumes:
      - minio:/data
    command: server /data --console-address ":9001"

volumes:
  db:
  minio:
  mailhog:
