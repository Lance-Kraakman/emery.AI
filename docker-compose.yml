services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: dashlet
      POSTGRES_DB: emery
      POSTGRES_USER: postgres
    volumes:
      - db:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: emery
      MINIO_ROOT_PASSWORD: dashlet123
    volumes:
      - minio:/data
    command: server /data --console-address ":9001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:dashlet@db:5432/emery"
      S3_BUCKET_NAME: "emery-local"
      GRPC_AGENT_URL: "agent:50051"
      NEXTAUTH_URL: "http://localhost:3000"
      # Add other required environment variables from .env.local or .env.example
    depends_on:
      - db
      - agent

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:dashlet@db:5432/emery"
      # Add other required environment variables
    command: "scheduler"
    depends_on:
      - db

  agent:
    build:
      context: ./emery-agents
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      S3_BUCKET_NAME: "emery-local"
      # Add other required environment variables
    depends_on:
      - db

volumes:
  db:
  minio:
