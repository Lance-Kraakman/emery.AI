services:
  postgres-test:
    image: pgvector/pgvector:pg17  # Same as main docker-compose
    container_name: emery-test-db
    environment:
      POSTGRES_DB: emery_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:5434:5432"  # Different port to avoid conflicts
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ../initdb.d:/docker-entrypoint-initdb.d  # Same init scripts as main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emery_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  test_postgres_data: