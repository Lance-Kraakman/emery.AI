services:
  postgres-integration:
    image: pgvector/pgvector:pg17
    container_name: emery-integration-db
    environment:
      POSTGRES_DB: emery_integration_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration_test_password
    ports:
      - "127.0.0.1:5436:5432"  # Different from main (5433) and RLS tests (5434)
    volumes:
      - integration_postgres_data:/var/lib/postgresql/data
      - ../../initdb.d:/docker-entrypoint-initdb.d  # Same init scripts as main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emery_integration_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-test-network

  app-integration:
    image: emery-integration-app:prod
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: emery-integration-app
    ports:
      - "127.0.0.1:3002:3000"  # Different from main (3000) and potential dev (3001)
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      NODE_ENV: production
      # Override WORKER_ADDRESS for internal container network
      WORKER_ADDRESS: agent-chat-integration:50051
      GRPC_TOOLS_ADDRESS: agent-table-integration:50052    # Table operations (internal network)
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: emery-files
      S3_FORCE_PATH_STYLE: true
      S3_ENDPOINT_URL: http://minio-integration:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Redis for caching (ioredis)
      REDIS_URL: redis://redis-integration:6379
    depends_on:
      postgres-integration:
        condition: service_healthy
      minio-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
      agent-chat-integration:
        condition: service_healthy
      agent-table-integration:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - integration-test-network

  redis-integration:
    image: redis:7-alpine
    container_name: emery-integration-redis
    ports:
      - "127.0.0.1:6380:6379"  # Different from potential dev Redis (6379)
    command: redis-server --appendonly yes
    volumes:
      - integration_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-test-network

  minio-integration:
    image: minio/minio:latest
    container_name: emery-integration-minio
    ports:
      - "127.0.0.1:9005:9000"  # Different from potential dev MinIO
      - "127.0.0.1:9006:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: emery-files
    command: server /data --console-address ":9001"
    volumes:
      - integration_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-test-network

  agent-chat-integration:
    build:
      context: ../../emery-agents
      dockerfile: Dockerfile
    container_name: emery-integration-chat-agent
    ports:
      - "127.0.0.1:50053:50051"  # Chat processing service
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      PYTHONPATH: /usr/src/app/src
      WORKER_ADDRESS: agent-chat-integration:50051        # Chat service (internal network)
      USE_PIPEDREAM_TOOLS: true
      NEXTJS_BASE_URL: http://app-integration:3000
    depends_on:
      postgres-integration:
        condition: service_healthy
      minio-integration:
        condition: service_healthy
    command: ["python", "-m", "emery_agents.grpc.server", "--mode=chat", "--port=50051"]
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - integration-test-network

  agent-table-integration:
    build:
      context: ../../emery-agents
      dockerfile: Dockerfile
    container_name: emery-integration-table-agent
    ports:
      - "127.0.0.1:50054:50052"  # Table operations service
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      PYTHONPATH: /usr/src/app/src
      GRPC_TOOLS_ADDRESS: agent-table-integration:50052    # Table service (internal network)
      AWS_ENDPOINT_URL: http://minio-integration:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: emery-files
      AWS_ALLOW_HTTP: "true"
      AWS_S3_ALLOW_UNSAFE_RENAME: "true"
    depends_on:
      postgres-integration:
        condition: service_healthy
      minio-integration:
        condition: service_healthy
    command: ["python", "-m", "emery_agents.grpc.server", "--mode=table", "--port=50052"]
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50052')).result(timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - integration-test-network

  scheduler-integration:
    image: emery-integration-scheduler:prod
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: emery-integration-scheduler
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      NODE_ENV: production
      # Override WORKER_ADDRESS for internal container network to reach agent
      WORKER_ADDRESS: agent-chat-integration:50051
      # MinIO S3 configuration for integration tests (internal container network)
      AWS_ENDPOINT_URL: http://minio-integration:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio-integration:9000
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: emery-files
      S3_FORCE_PATH_STYLE: true
    command: "scheduler"
    depends_on:
      postgres-integration:
        condition: service_healthy
      agent-chat-integration:
        condition: service_healthy
    networks:
      - integration-test-network

  # # Cloudflare Tunnel for exposing webhooks to Pipedream during local dev
  # # Configure tunnel in Cloudflare Dashboard: Zero Trust → Networks → Tunnels
  # # Point to: http://app-integration:3000
  # # Requires TUNNEL_TOKEN in .env.local (get from Cloudflare Dashboard)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: emery-integration-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --protocol http2 run
  #   env_file:
  #     - ../../.env.local
  #   depends_on:
  #     app-integration:
  #       condition: service_healthy
  #   networks:
  #     - integration-test-network

volumes:
  integration_postgres_data:  # Isolated volume for integration tests
  integration_minio_data:     # MinIO data for S3 storage testing
  integration_redis_data:     # Redis data for caching

networks:
  integration-test-network:
    driver: bridge