services:
  postgres-integration:
    image: pgvector/pgvector:pg17
    container_name: emery-integration-db
    environment:
      POSTGRES_DB: emery_integration_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration_test_password
    ports:
      - "127.0.0.1:5436:5432"  # Different from main (5433) and RLS tests (5434)
    volumes:
      - integration_postgres_data:/var/lib/postgresql/data
      - ../../initdb.d:/docker-entrypoint-initdb.d  # Same init scripts as main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emery_integration_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-test-network

  app-integration:
    profiles: ["app"]  # Only start with --profile app (for local dev, run pnpm dev instead)
    image: emery-integration-app:prod
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: emery-integration-app
    ports:
      - "127.0.0.1:3002:3000"  # Different from main (3000) and potential dev (3001)
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      NODE_ENV: production
      GRPC_INSECURE: "true"
      ENCRYPTION_PASSTHROUGH: "true"
      # Override WORKER_ADDRESS for internal container network
      WORKER_ADDRESS: agent-chat-integration:50051
      GRPC_TOOLS_ADDRESS: agent-table-integration:50052    # Table operations (internal network)
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: enhancd-files
      S3_FORCE_PATH_STYLE: true
      S3_ENDPOINT_URL: http://minio-integration:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Redis for caching (ioredis)
      REDIS_URL: redis://redis-integration:6379
      # Workspace storage (shared with agents)
      WORKSPACE_STORAGE_PATH: /mnt/storage/workspaces
      # Internal API secret for SSH key fetching
      INTERNAL_API_SECRET: local-dev-secret
    volumes:
      # Shared workspace storage (same as agent services)
      - ${WORKSPACE_HOST_PATH:-../../.workspace-data}:/mnt/storage/workspaces
    depends_on:
      postgres-integration:
        condition: service_healthy
      minio-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
      agent-chat-integration:
        condition: service_healthy
      agent-table-integration:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - integration-test-network

  redis-integration:
    image: redis:7-alpine
    container_name: emery-integration-redis
    ports:
      - "127.0.0.1:6380:6379"  # Different from potential dev Redis (6379)
    command: redis-server --appendonly yes
    volumes:
      - integration_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-test-network

  minio-integration:
    image: minio/minio:latest
    container_name: emery-integration-minio
    ports:
      - "127.0.0.1:9005:9000"  # Different from potential dev MinIO
      - "127.0.0.1:9006:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: enhancd-files
    command: server /data --console-address ":9001"
    volumes:
      - integration_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - integration-test-network

  agent-chat-integration:
    build:
      context: ../../emery-agents
      dockerfile: Dockerfile
    container_name: emery-integration-chat-agent
    user: "1000:1000"  # Match SFTP server UID for workspace write permissions
    ports:
      - "127.0.0.1:50053:50051"  # Chat processing service
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      PYTHONPATH: /usr/src/app/src
      GRPC_INSECURE: "true"
      WORKER_ADDRESS: agent-chat-integration:50051        # Chat service (internal network)
      USE_PIPEDREAM_TOOLS: true
      AWS_ENDPOINT_URL: http://minio-integration:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: enhancd-files
      NEXTJS_BASE_URL: ${NEXTJS_BASE_URL_DOCKER:-http://app-integration:3000}
      EMERY_DEBUG_PROMPTS: "1"
      WORKSPACE_STORAGE_PATH: /mnt/storage/workspaces
      HOME: /usr/local/share
    volumes:
      # Shared workspace storage (same as SSH sync server)
      - ${WORKSPACE_HOST_PATH:-../../.workspace-data}:/mnt/storage/workspaces
    depends_on:
      postgres-integration:
        condition: service_healthy
      minio-integration:
        condition: service_healthy
    command: ["python", "-m", "emery_agents.grpc.server", "--mode=chat", "--port=50051"]
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - integration-test-network

  agent-table-integration:
    build:
      context: ../../emery-agents
      dockerfile: Dockerfile
    container_name: emery-integration-table-agent
    user: "1000:1000"  # Match SFTP server UID for workspace write permissions
    ports:
      - "127.0.0.1:50054:50052"  # Table operations service
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      PYTHONPATH: /usr/src/app/src
      GRPC_INSECURE: "true"
      GRPC_TOOLS_ADDRESS: agent-table-integration:50052    # Table service (internal network)
      AWS_ENDPOINT_URL: http://minio-integration:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: enhancd-files
      AWS_ALLOW_HTTP: "true"
      AWS_S3_ALLOW_UNSAFE_RENAME: "true"
      REDIS_URL: redis://redis-integration:6379
      WORKSPACE_STORAGE_PATH: /mnt/storage/workspaces
      HOME: /usr/local/share
    volumes:
      # Shared workspace storage (same as SSH sync server)
      - ${WORKSPACE_HOST_PATH:-../../.workspace-data}:/mnt/storage/workspaces
    depends_on:
      postgres-integration:
        condition: service_healthy
      minio-integration:
        condition: service_healthy
      redis-integration:
        condition: service_healthy
    command: ["python", "-m", "emery_agents.grpc.server", "--mode=table", "--port=50052"]
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50052')).result(timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - integration-test-network

  # SSH + rsync server for workspace sync (Tauri desktop client connects here)
  # Uses AuthorizedKeysCommand to fetch SSH keys from API - see docker/ssh-sync/README.md
  # Note: For local dev, API_HOST is overridden in docker-compose.integration.dev.yml
  ssh-sync-integration:
    build:
      context: ../../docker/ssh-sync
      dockerfile: Dockerfile
    container_name: emery-integration-ssh-sync
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - USER_NAME=agent
      - PASSWORD_ACCESS=false
      - SUDO_ACCESS=false
      - DOCKER_MODS=linuxserver/mods:openssh-server-rsync
      - INTERNAL_API_SECRET=local-dev-secret
      - API_HOST=app-integration:3000
    volumes:
      - ${WORKSPACE_HOST_PATH:-../../.workspace-data}:/workspace
    networks:
      - integration-test-network

  scheduler-integration:
    profiles: ["app"]  # Only start with --profile app (for local dev, run pnpm scheduler:start instead)
    image: emery-integration-scheduler:prod
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: emery-integration-scheduler
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://postgres:integration_test_password@postgres-integration:5432/emery_integration_test
      NODE_ENV: production
      GRPC_INSECURE: "true"                                                                                                                                                        
      ENCRYPTION_PASSTHROUGH: "true" 
      # Override WORKER_ADDRESS for internal container network to reach agent
      WORKER_ADDRESS: agent-chat-integration:50051
      # MinIO S3 configuration for integration tests (internal container network)
      AWS_ENDPOINT_URL: http://minio-integration:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio-integration:9000
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: enhancd-files
      S3_FORCE_PATH_STYLE: true
    command: "scheduler"
    depends_on:
      postgres-integration:
        condition: service_healthy
      agent-chat-integration:
        condition: service_healthy
    networks:
      - integration-test-network

  # # Cloudflare Tunnel for exposing webhooks to Pipedream during local dev
  # # Configure tunnel in Cloudflare Dashboard: Zero Trust → Networks → Tunnels
  # # Point to: http://app-integration:3000
  # # Requires TUNNEL_TOKEN in .env.local (get from Cloudflare Dashboard)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: emery-integration-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --protocol http2 run
  #   env_file:
  #     - ../../.env.local
  #   depends_on:
  #     app-integration:
  #       condition: service_healthy
  #   networks:
  #     - integration-test-network

volumes:
  integration_postgres_data:  # Isolated volume for integration tests
  integration_minio_data:     # MinIO data for S3 storage testing
  integration_redis_data:     # Redis data for caching
  # Workspace storage is configurable via WORKSPACE_HOST_PATH env var:
  #   - Local dev (Next.js on host): WORKSPACE_HOST_PATH=../../.workspace-data (default)
  #   - Full Docker: WORKSPACE_HOST_PATH=workspace_data (uses named volume below)
  workspace_data:             # Named volume for full Docker mode

networks:
  integration-test-network:
    driver: bridge