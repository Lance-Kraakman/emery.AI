[package]
name = "enhancd"
version = "0.1.0"
description = "enhancd.ai Desktop"
authors = ["enhancd.ai"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.9.1", features = [] }
tauri-plugin-log = "2"

# Workspace sync plugins
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"

# Workspace sync utilities
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
thiserror = "1"
httpdate = "1"

# Delta sync (hash-based efficient transfers)
sha2 = "0.10"
walkdir = "2"
base64 = "0.22"

# rsync sync (via shell command + SSH key auth)
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }  # Cross-platform SSH key generation
dirs = "5.0"            # Cross-platform home/config directories
notify = "6.1"          # Filesystem watcher for event-driven sync
notify-debouncer-mini = "0.4"  # Debounce rapid file changes
reqwest = { version = "0.12", features = ["json"] }  # HTTP client for API calls
reqwest-eventsource = "0.6"  # SSE client for real-time agent updates
futures = "0.3"         # Async stream utilities for SSE
lazy_static = "1.4"     # Global statics for connection/watcher managers
