[package]
name = "enhancd"
version = "0.1.0"
description = "enhancd.ai Desktop"
authors = ["enhancd.ai"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.9.1", features = [] }
tauri-plugin-log = "2"

# Workspace sync plugins
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"

# Workspace sync utilities
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
thiserror = "1"
httpdate = "1"

# Delta sync (hash-based efficient transfers)
sha2 = "0.10"
walkdir = "2"
base64 = "0.22"

# SFTP + rsync sync (new)
fast_rsync = "0.2"      # Pure Rust rsync algorithm
ssh2 = "0.9"            # SFTP client
notify = "6.1"          # Filesystem watcher for event-driven sync
notify-debouncer-mini = "0.4"  # Debounce rapid file changes
lazy_static = "1.4"     # Global static for connection manager
