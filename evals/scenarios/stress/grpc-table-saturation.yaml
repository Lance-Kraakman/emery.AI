  - description: "Heavy write (7/20)"
    vars:
      operation: "create_row"
      data:
        name: "Heavy Row 7"
        heavy_test: true
    assert:
      - type: is-json

  - description: "Heavy write (8/20)"
    vars:
      operation: "create_row"
      data:
