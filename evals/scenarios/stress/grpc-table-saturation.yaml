        name: "Heavy Row 19"
        heavy_test: true
    assert:
      - type: is-json

  - description: "Heavy write (20/20)"
    vars:
      operation: "create_row"
      data:
        name: "Heavy Row 20"
        heavy_test: true
    assert:
      - type: is-json

  # Phase 4: Read after writes (verify data integrity)
  - description: "Verify: get_rows after burst writes"
    vars:
      operation: "get_rows"
      limit: 50
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.success === true || data.data?.rows !== undefined;
