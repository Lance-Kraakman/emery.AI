  # Recovery verification
  - description: "Recovery 1: verify reads work"
    vars:
      operation: "get_rows"
      limit: 50
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.success === true || data.data?.rows !== undefined;

  - description: "Recovery 2: verify tables accessible"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.success === true || Array.isArray(data.data);

  - description: "Recovery 3: verify writes work"
    vars:
      operation: "create_row"
      data:
        name: "Recovery Test Row"
        phase: "recovery"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.success === true || !data.error;
