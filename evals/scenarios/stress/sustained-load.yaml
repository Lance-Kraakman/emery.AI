# AIDEV-NOTE: Sustained Load Test for ECS Scaling
# Long-running test to trigger ECS auto-scaling (CPU > 70%)
#
# Purpose:
# - Generate sustained CPU load to trigger scale-out
# - Verify no dropped requests during scaling
# - Test recovery after load subsides
#
# Monitor during test:
# - CloudWatch: ECS CPU/Memory
# - RDS connections
# - ALB error rates
#
# Run: ./run-evals.sh stress

description: "Sustained load test for ECS scaling verification"

providers:
  - file://../../providers/emery-crud.ts

prompts:
  - "Execute CRUD operation: {{operation}}"

tests:
  # Warm-up phase (10 ops)
  - description: "Warmup: list_tables 1"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Warmup: get_rows 1"
    vars:
      operation: "get_rows"
      limit: 50
    assert:
      - type: is-json

  - description: "Warmup: create_row 1"
    vars:
      operation: "create_row"
      data:
        name: "Sustained Test Row"
        phase: "warmup"
    assert:
      - type: is-json

  - description: "Warmup: list_fields"
    vars:
      operation: "list_fields"
    assert:
      - type: is-json

  - description: "Warmup: get_table"
    vars:
      operation: "get_table"
    assert:
      - type: is-json

  # Sustained phase - 50 operations to generate load
  # Mix of reads and writes to stress both DB and gRPC
