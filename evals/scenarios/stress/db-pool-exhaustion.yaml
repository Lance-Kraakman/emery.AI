# AIDEV-NOTE: DB Connection Pool Exhaustion Test
# Tests behavior when concurrent requests exceed the 5-connection pool limit
#
# Expected behavior:
# - First 5 concurrent requests proceed normally
# - Additional requests queue or receive 503/timeout
# - No crashes or connection errors
#
# Run: ./run-evals.sh stress

description: "Test DB connection pool under concurrent load"

providers:
  - file://../../providers/emery-crud.ts

prompts:
  - "Execute CRUD operation: {{operation}}"

# Promptfoo runs tests sequentially by default
# Use repeat to simulate concurrent-ish load
defaultTest:
  options:
    # Promptfoo concurrency setting
    runSerially: false

tests:
  # Phase 1: Baseline - single requests work
  - description: "Baseline: single list_tables request"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.success === true || Array.isArray(data.data);

  # Phase 2: Moderate load - 5 concurrent (at pool limit)
  - description: "Pool limit: concurrent list_tables (1/5)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Pool limit: concurrent list_tables (2/5)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Pool limit: concurrent list_tables (3/5)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Pool limit: concurrent list_tables (4/5)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Pool limit: concurrent list_tables (5/5)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  # Phase 3: Over capacity - 10 requests (2x pool size)
  - description: "Over capacity: list_tables (1/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          // Accept success OR graceful timeout/503
          return data.success === true ||
                 Array.isArray(data.data) ||
                 (data.error && (data.error.includes('timeout') || data.error.includes('503')));

  - description: "Over capacity: list_tables (2/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (3/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (4/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (5/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (6/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (7/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (8/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (9/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  - description: "Over capacity: list_tables (10/10)"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json

  # Phase 4: Heavy read mix
  - description: "Heavy load: get_table"
    vars:
      operation: "get_table"
    assert:
      - type: is-json

  - description: "Heavy load: list_fields"
    vars:
      operation: "list_fields"
    assert:
      - type: is-json

  - description: "Heavy load: get_rows"
    vars:
      operation: "get_rows"
      limit: 10
    assert:
      - type: is-json

  # Phase 5: Recovery check
  - description: "Recovery: list_tables after load"
    vars:
      operation: "list_tables"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.success === true || Array.isArray(data.data);
