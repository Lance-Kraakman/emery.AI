# AIDEV-NOTE: Field CRUD operation tests
# Tests create_field, list_fields, delete_field operations
#
# Run: npx promptfoo eval --config scenarios/crud/field-operations.yaml

description: "Test field/column CRUD operations"

providers:
  - file://../../providers/emery-crud.ts

# Promptfoo requires a prompt, but we're testing CRUD directly via vars
prompts:
  - "Execute CRUD operation: {{operation}}"

tests:
  # Test 1: List existing fields
  - description: "List fields for a table"
    vars:
      operation: "list_fields"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return Array.isArray(data) || (data && typeof data === 'object');

  # Test 2: Create a text field
  - description: "Create text field"
    vars:
      operation: "create_field"
      field_name: "eval_test_notes"
      field_type: "text"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          // Success or "already exists" is acceptable
          return !data.error || data.error.includes('already exists');

  # Test 3: Create a number field
  - description: "Create number field"
    vars:
      operation: "create_field"
      field_name: "eval_test_count"
      field_type: "number"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return !data.error || data.error.includes('already exists');

  # Test 4: Create a boolean field
  - description: "Create boolean field"
    vars:
      operation: "create_field"
      field_name: "eval_test_active"
      field_type: "boolean"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return !data.error || data.error.includes('already exists');

  # Test 5: Create a date field
  - description: "Create date field"
    vars:
      operation: "create_field"
      field_name: "eval_test_created"
      field_type: "date"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return !data.error || data.error.includes('already exists');

  # Test 6: Verify fields were created
  - description: "Verify created fields exist"
    vars:
      operation: "list_fields"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const fields = Array.isArray(data) ? data : (data.fields || []);
          const fieldNames = fields.map(f => f._name || f.name);
          return fieldNames.includes('eval_test_notes') ||
                 fieldNames.includes('eval_test_count');

  # Test 7: Delete the test fields (cleanup)
  - description: "Delete eval_test_notes field"
    vars:
      operation: "delete_field"
      field_name: "eval_test_notes"
    assert:
      - type: is-json

  - description: "Delete eval_test_count field"
    vars:
      operation: "delete_field"
      field_name: "eval_test_count"
    assert:
      - type: is-json

  - description: "Delete eval_test_active field"
    vars:
      operation: "delete_field"
      field_name: "eval_test_active"
    assert:
      - type: is-json

  - description: "Delete eval_test_created field"
    vars:
      operation: "delete_field"
      field_name: "eval_test_created"
    assert:
      - type: is-json

  # Test 8: Error cases
  - description: "Create field with missing type should fail"
    vars:
      operation: "create_field"
      field_name: "incomplete_field"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.error !== undefined || data.success === false;

  - description: "Create field with invalid type should fail"
    vars:
      operation: "create_field"
      field_name: "invalid_type_field"
      field_type: "not_a_valid_type"
    assert:
      - type: is-json
      # API should reject invalid field types, but if it accepts, that's also fine for this test
