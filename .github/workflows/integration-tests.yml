name: Integration Tests

on:
  push:
    branches: [main, staging, develop, "*"]
  pull_request:
    branches: [main, staging, develop]
  workflow_call:  # Allow this workflow to be called from other workflows

env:
  POSTGRES_PASSWORD: test_password
  POSTGRES_USER: postgres
  POSTGRES_DB: emery_test

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Use HTTPS for Git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          uv venv tests/.venv
          source tests/.venv/bin/activate  
          uv pip install pytest psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5434 -U ${{ env.POSTGRES_USER }}; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5434/${{ env.POSTGRES_DB }}
        run: pnpm db:migrate

      - name: Run RLS Integration Tests
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5434/${{ env.POSTGRES_DB }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source tests/.venv/bin/activate
          cd tests
          python -m pytest rls/ -v --tb=short

      - name: Run Python Agent Tests
        env:
          HF_TOKEN: test-token-placeholder
          PYTHONPATH: ${{ github.workspace }}/emery-agents/src
        working-directory: emery-agents
        run: uv run python -m pytest tests/ -v --tb=short

      - name: Test TypeScript Integration
        run: pnpm typecheck

      - name: Test Linting
        run: pnpm lint