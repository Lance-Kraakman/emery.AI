name: Deploy CDK Application

on:
  workflow_run:
    workflows: ["Docker Build & Test"]
    types:
      - completed
    branches:
      - main
      - staging
      - develop

env:
  AWS_REGION: ap-southeast-2
  ECR_FRONTEND_REPO: emery/frontend
  ECR_AGENT_REPO: emery/agent

jobs:
  check-docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Build Success
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Docker Build & Test workflow failed. Cannot proceed with deployment."
            echo "Please check the Docker build logs and fix any issues."
            exit 1
          fi
          echo "✅ Docker Build & Test workflow completed successfully"

  get-environment:
    runs-on: ubuntu-latest
    needs: [check-docker-build]
    if: always() && needs.check-docker-build.result == 'success'
    outputs:
      env_name: ${{ steps.get_env.outputs.env_name }}
      aws_region: ${{ steps.get_env.outputs.aws_region }}
      branch_name: ${{ steps.get_env.outputs.branch_name }}
      commit_sha: ${{ steps.get_env.outputs.commit_sha }}
    steps:
      - name: Identify Environment
        id: get_env
        run: |
          # For workflow_run events, get branch and SHA from the triggering workflow
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          
          if [ "${BRANCH_NAME}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          elif [ "${BRANCH_NAME}" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          elif [ "${BRANCH_NAME}" = "develop" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi
          echo "aws_region=${{ env.AWS_REGION }}" >> $GITHUB_OUTPUT

  deploy:
    needs: get-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.get-environment.outputs.env_name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CDK and Python Dependencies
        working-directory: ./infra
        run: |
          npm install -g aws-cdk
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Support both IAM roles (preferred) and access keys (fallback)
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.get-environment.outputs.aws_region }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify required ECR images exist
        id: check-images
        run: |
          BRANCH_NAME=${{ needs.get-environment.outputs.branch_name }}
          COMMIT_SHA=${{ needs.get-environment.outputs.commit_sha }}
          AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${{ needs.get-environment.outputs.aws_region }}.amazonaws.com
          
          # Define required image URIs using branch name as tag
          FRONTEND_URI="${ECR_REGISTRY}/${{ env.ECR_FRONTEND_REPO }}:${BRANCH_NAME}"
          AGENT_URI="${ECR_REGISTRY}/${{ env.ECR_AGENT_REPO }}:${BRANCH_NAME}"
          
          echo "🔍 Checking for required ECR images with branch name..."
          echo "Branch: ${BRANCH_NAME}"
          echo "Frontend image: ${FRONTEND_URI}"
          echo "Agent image: ${AGENT_URI}"
          
          # Verify frontend image exists (required)
          if aws ecr describe-images --repository-name ${{ env.ECR_FRONTEND_REPO }} --image-ids imageTag=${BRANCH_NAME} >/dev/null 2>&1; then
            echo "✅ Found required frontend image: ${FRONTEND_URI}"
            echo "frontend_image_uri=${FRONTEND_URI}" >> $GITHUB_OUTPUT
          else
            echo "❌ ERROR: Required frontend image not found: ${FRONTEND_URI}"
            echo "Expected tag: ${BRANCH_NAME}"
            echo "Please ensure the Docker Build & Test workflow completed successfully."
            exit 1
          fi
          
          # Verify agent image exists (required)
          if aws ecr describe-images --repository-name ${{ env.ECR_AGENT_REPO }} --image-ids imageTag=${BRANCH_NAME} >/dev/null 2>&1; then
            echo "✅ Found required agent image: ${AGENT_URI}"
            echo "agent_image_uri=${AGENT_URI}" >> $GITHUB_OUTPUT
          else
            echo "❌ ERROR: Required agent image not found: ${AGENT_URI}"
            echo "Expected tag: ${BRANCH_NAME}"
            echo "Please ensure the Docker Build & Test workflow completed successfully."
            exit 1
          fi
          
          echo "🎉 All required ECR images found with branch name!"
          echo "Using branch image versions for deployment."

      - name: Bootstrap CDK Environment
        working-directory: ./infra
        run: |
          source .venv/bin/activate
          cdk bootstrap

      - name: Deploy CDK Stack
        working-directory: ./infra
        env:
          # Use verified ECR images (guaranteed to exist after previous step)
          FRONTEND_IMAGE_URI: ${{ steps.check-images.outputs.frontend_image_uri }}
          AGENT_IMAGE_URI: ${{ steps.check-images.outputs.agent_image_uri }}
        run: |
          source .venv/bin/activate
          
          echo "🚀 Deploying CDK stack with ECR images..."
          echo "Environment: ${{ needs.get-environment.outputs.env_name }}"
          echo "Region: ${{ needs.get-environment.outputs.aws_region }}"
          echo "📦 Frontend image: $FRONTEND_IMAGE_URI"
          echo "📦 Agent image: $AGENT_IMAGE_URI"
          
          cdk deploy --all --require-approval never \
            -c env=${{ needs.get-environment.outputs.env_name }} \
            -c aws_account_id=${{ secrets.AWS_ACCOUNT_ID }} \
            -c region=${{ needs.get-environment.outputs.aws_region }}

      - name: Output deployment info
        run: |
          echo "✅ CDK Deployment completed successfully!"
          echo "🌍 Environment: ${{ needs.get-environment.outputs.env_name }}"
          echo "📍 Region: ${{ needs.get-environment.outputs.aws_region }}"
          echo "🌿 Branch: ${{ needs.get-environment.outputs.branch_name }}"
          echo "📝 Commit: ${{ needs.get-environment.outputs.commit_sha }}"
          echo "📦 Frontend: ${{ steps.check-images.outputs.frontend_image_uri }}"
          echo "📦 Agent: ${{ steps.check-images.outputs.agent_image_uri }}"
          echo "⚡ Deployment completed using exact commit version!"
