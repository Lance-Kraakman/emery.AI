name: Deploy CDK Application

on:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  get-environment:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.get_env.outputs.env_name }}
      aws_region: ${{ steps.get_env.outputs.aws_region }}
    steps:
      - name: Identify Environment
        id: get_env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi
          echo "aws_region=${{ vars.AWS_REGION || 'ap-southeast-2' }}" >> $GITHUB_OUTPUT

  deploy:
    needs: get-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.get-environment.outputs.env_name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CDK and Python Dependencies
        working-directory: ./infra
        run: |
          npm install -g aws-cdk
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.get-environment.outputs.aws_region }}

      - name: Bootstrap CDK Environment
        working-directory: ./infra
        run: |
          source .venv/bin/activate
          cdk bootstrap

      - name: Deploy CDK Stack
        working-directory: ./infra
        run: |
          source .venv/bin/activate
          cdk deploy --all --require-approval never -c env=${{ needs.get-environment.outputs.env_name }} -c aws_account_id=${{ secrets.AWS_ACCOUNT_ID }} -c region=${{ needs.get-environment.outputs.aws_region }}
