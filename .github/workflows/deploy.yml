name: Deploy CDK Application

on:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    # These permissions are needed for the AWS OIDC provider
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identify Environment
        id: get_env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "env_name=development" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.get_env.outputs.env_name
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CDK and Python Dependencies
        if: steps.get_env.outputs.env_name
        working-directory: ./infra
        run: |
          npm install -g aws-cdk
          python3 -m venv .venv
          source .venv/bin/activate
          # Assuming requirements.txt will be created from pyproject.toml
          # If you use pip-tools or similar, you might generate it here.
          # For now, we'll assume manual creation or a different dependency manager.
          # If you have a requirements.txt, uncomment the line below
          pip install -r requirements.txt
          # If you use poetry or another tool, the command would be different, e.g.:
          # pip install poetry && poetry install

      - name: Synth CDK Template
        if: steps.get_env.outputs.env_name
        working-directory: ./infra
        run: |
          source .venv/bin/activate
          cdk synth --all -c env=${{ steps.get_env.outputs.env_name }}
