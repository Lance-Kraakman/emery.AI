name: Docker Build & Test

on:
  push:
    branches: [main, develop, refactor-best-practices]
  pull_request:
    branches: [main, develop, refactor-best-practices]

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com
  FRONTEND_REPO: emery/frontend
  AGENT_REPO: emery/agent

jobs:
  get-environment:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.get_env.outputs.env_name }}
    steps:
      - name: Identify Environment
        id: get_env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi

  setup-repositories:
    needs: get-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.get-environment.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repositories if they don't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.FRONTEND_REPO }} || \
          aws ecr create-repository --repository-name ${{ env.FRONTEND_REPO }} --image-scanning-configuration scanOnPush=true
          
          aws ecr describe-repositories --repository-names ${{ env.AGENT_REPO }} || \
          aws ecr create-repository --repository-name ${{ env.AGENT_REPO }} --image-scanning-configuration scanOnPush=true

  build-frontend:
    needs: [get-environment, setup-repositories]
    runs-on: ubuntu-latest
    environment: ${{ needs.get-environment.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64  # AMD64 may be faster for builds than ARM64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=frontend-${{ github.ref_name }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # - name: Run security scan
      #   if: github.event_name != 'pull_request'
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ github.sha }}
      #     format: 'sarif'
      #     output: 'trivy-results-frontend.sarif'

      # - name: Upload security scan results
      #   if: github.event_name != 'pull_request'
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: 'trivy-results-frontend.sarif'

      - name: Test container functionality
        if: github.event_name == 'pull_request'
        run: |
          IMAGE_TAG=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          docker run --rm \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test" \
            -e NEXTAUTH_SECRET="test-secret" \
            -e NODE_ENV="test" \
            --entrypoint="" \
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${IMAGE_TAG} \
            sh -c "echo '✅ Frontend container test passed'"

  build-agent:
    needs: [get-environment, setup-repositories]
    runs-on: ubuntu-latest
    environment: ${{ needs.get-environment.outputs.env_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.AGENT_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push agent image
        uses: docker/build-push-action@v5
        with:
          context: ./emery-agents
          file: ./emery-agents/Dockerfile
          platforms: linux/amd64  # AMD64 may be faster for builds than ARM64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=agent-${{ github.ref_name }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # - name: Run security scan
      #   if: github.event_name != 'pull_request'
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.ECR_REGISTRY }}/${{ env.AGENT_REPO }}:${{ github.sha }}
      #     format: 'sarif'
      #     output: 'trivy-results-agent.sarif'

      # - name: Upload security scan results
      #   if: github.event_name != 'pull_request'
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: 'trivy-results-agent.sarif'

      - name: Test container functionality
        if: github.event_name == 'pull_request'
        run: |
          IMAGE_TAG=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          docker run --rm \
            -e HF_TOKEN="test-token" \
            --entrypoint="" \
            ${{ env.ECR_REGISTRY }}/${{ env.AGENT_REPO }}:${IMAGE_TAG} \
            sh -c "python -c 'import emery_agents; print(\"✅ Agent container test passed\")'"